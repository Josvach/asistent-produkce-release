# Sestaví DMG desktopové appky a vydá je jako release.
#
# Spouští se pushem do větve `build-input` (dělá to vydávací workflow v soukromém
# repu nebo ručně). Ta obsahuje input/app.tar.gz — už ZKOMPILOVANOU appku
# (Electron obal + Next standalone server), žádný zdrojový kód — a input/build.json
# s číslem verze. Tady se jen přidá nativní VROOM, zabalí se .app/.dmg pro
# Apple Silicon i Intel, vydá release a do main se zapíše latest.json pro
# automatické aktualizace. Když build.json nese `mandatory: true`, zapíše se
# i podepsaný policy.json — starší verze se zablokují a samy aktualizují.
# Větev build-input se nakonec smaže.
name: Sestavit desktop

on:
  push:
    branches: [build-input]

permissions:
  contents: write

concurrency:
  group: build-desktop
  cancel-in-progress: false

env:
  # VROOM 1.15+ používá std::format, jehož desetinná čísla má libc++ v macOS
  # až od 13.3 — pro macOS 12 Monterey se nesestaví. 1.14.0 ho nepoužívá;
  # 1.13.0 (C++17) je záloha.
  VROOM_TAGS: v1.14.0 v1.13.0
  # Intel build zůstává na Electronu 43 — poslední řada, která běží na
  # macOS 12 Monterey (Electron 44+ vyžaduje macOS 13). NEZVYŠOVAT, dokud
  # má běžet na starých Intel MacBoocích.
  ELECTRON_X64: 43.1.0

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rozbalit vstup
        run: |
          # Balík nad 100 MB přijde po kusech (GitHub větší soubor nepřijme).
          [ -f input/app.tar.gz ] || cat input/app.tar.gz.part-* > input/app.tar.gz
          tar -xzf input/app.tar.gz
          V=$(node -p "require('./input/build.json').version")
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Neplatná verze $V"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
          node -p "require('./input/build.json').notes || ''" > notes.txt
          echo "Verze $V"

      # ── VROOM (nativní solver tras) ─────────────────────────────────────
      - name: Cache VROOM
        id: vroom-cache
        uses: actions/cache@v4
        with:
          path: vroom-bin
          key: vroom-v1.14.0-v1.13.0-macos12-arm64-x64-v2

      - name: Sestavit VROOM
        if: steps.vroom-cache.outputs.cache-hit != 'true'
        # Bez VROOM appka funguje (plánovač dopravy běží jako na webu) — jeho
        # selhání tedy vydání nezastaví, jen se ohlásí.
        continue-on-error: true
        run: |
          mkdir -p vroom-bin
          for arch in arm64 x86_64; do
            out=$([ "$arch" = "x86_64" ] && echo x64 || echo arm64)
            for tag in $VROOM_TAGS; do
              rm -rf "/tmp/vroom-$arch"
              git clone -q --depth 1 --branch "$tag" --recurse-submodules --shallow-submodules \
                https://github.com/VROOM-Project/vroom "/tmp/vroom-$arch"
              if make -C "/tmp/vroom-$arch/src" -j"$(sysctl -n hw.ncpu)" USE_ROUTING=false \
                   CXX="clang++ -arch $arch -mmacosx-version-min=12.0" > "/tmp/vroom-$arch.log" 2>&1; then
                cp "/tmp/vroom-$arch/bin/vroom" "vroom-bin/vroom-$out"
                echo "VROOM $tag pro $out OK"
                break
              fi
              echo "::warning::VROOM $tag pro $out se nesestavil"; tail -5 "/tmp/vroom-$arch.log"
            done
          done

      - name: Ověřit VROOM
        continue-on-error: true
        run: |
          ls vroom-bin/vroom-* >/dev/null 2>&1 || { echo "::warning::Appka se vydá bez VROOM"; exit 0; }
          chmod +x vroom-bin/vroom-*
          file vroom-bin/*
          otool -l vroom-bin/vroom-arm64 | grep -A3 LC_BUILD_VERSION | grep minos || true
          cat > /tmp/vroom-smoke.json <<'JSON'
          {"vehicles":[{"id":1,"start_index":0,"end_index":0,"capacity":[2]}],
           "jobs":[{"id":1,"location_index":1,"pickup":[1]}],
           "matrices":{"car":{"durations":[[0,300],[300,0]]}}}
          JSON
          for b in vroom-bin/vroom-*; do
            "$b" -i /tmp/vroom-smoke.json | grep -q '"code":0' || { echo "::warning::$b nefunguje"; rm -f "$b"; }
          done
          mkdir -p app/build/bin && cp vroom-bin/vroom-* app/build/bin/ 2>/dev/null || true

      # ── Appka ───────────────────────────────────────────────────────────
      - name: Sestavit .app / .dmg / .zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm i -g electron-builder@26.15.3
          mkdir -p app/build/bin   # extraResources — i když se VROOM nepovedl
          cd app
          electron-builder --mac dmg zip --arm64 --publish never
          electron-builder --mac dmg zip --x64 --publish never -c.electronVersion="$ELECTRON_X64"
          ls -la dist

      - name: Ověřit appku (podpis, Info.plist, server v Apple Silicon buildu)
        run: |
          for d in mac-arm64 mac; do
            APP="app/dist/$d/Asistent Produkce.app"
            codesign --verify --deep --strict "$APP"
            plutil -p "$APP/Contents/Info.plist" | grep -E 'LSMinimumSystemVersion|CFBundleShortVersionString'
            ls "$APP/Contents/Resources/bin/" 2>/dev/null || echo "bez VROOM"
          done
          bash .github/smoke.sh "app/dist/mac-arm64/Asistent Produkce.app" 90

      - name: Uložit buildy pro další kroky
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            app/dist/AsistentProdukce-*.dmg
            app/dist/AsistentProdukce-*.zip
            notes.txt
          retention-days: 3
          if-no-files-found: error

  # Intel build se ověří na skutečném Intel Macu (na ARM runneru přes Rosettu
  # se Electron spouští příliš pomalu a nespolehlivě).
  intel:
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Ověřit Intel build (server a VROOM)
        run: |
          uname -m
          sw_vers
          ditto -x -k app/dist/AsistentProdukce-x64.zip /tmp/x64 2>/dev/null || ditto -x -k AsistentProdukce-x64.zip /tmp/x64
          APP="/tmp/x64/Asistent Produkce.app"
          codesign --verify --deep --strict "$APP"
          lipo -archs "$APP/Contents/MacOS/Asistent Produkce"
          if [ -x "$APP/Contents/Resources/bin/vroom-x64" ]; then
            cat > /tmp/vroom-smoke.json <<'JSON'
          {"vehicles":[{"id":1,"start_index":0,"end_index":0,"capacity":[2]}],
           "jobs":[{"id":1,"location_index":1,"pickup":[1]}],
           "matrices":{"car":{"durations":[[0,300],[300,0]]}}}
          JSON
            "$APP/Contents/Resources/bin/vroom-x64" -i /tmp/vroom-smoke.json | grep -q '"code":0'
            echo "VROOM x64 OK"
          fi
          bash .github/smoke.sh "$APP" 180

  release:
    needs: [build, intel]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verze
        run: |
          V=$(node -p "require('./input/build.json').version")
          echo "VERSION=$V" >> "$GITHUB_ENV"
          # Artefakt drží cestu app/dist/… — srovnat do jedné složky.
          find dist -type f \( -name '*.dmg' -o -name '*.zip' -o -name 'notes.txt' \) -exec mv {} dist/ \; 2>/dev/null || true
          ls -la dist

      - name: Manifest aktualizace
        run: |
          node -e "
            const fs = require('fs'), crypto = require('crypto');
            const files = {};
            for (const arch of ['arm64', 'x64']) {
              const name = 'AsistentProdukce-' + arch + '.zip';
              const buf = fs.readFileSync('dist/' + name);
              files[arch] = { name, sha256: crypto.createHash('sha256').update(buf).digest('hex'), size: buf.length };
            }
            const notes = fs.existsSync('dist/notes.txt') ? fs.readFileSync('dist/notes.txt', 'utf8').trim() : '';
            const m = { version: process.env.VERSION, date: new Date().toISOString(), notes, files };
            fs.writeFileSync('latest.json', JSON.stringify(m, null, 2));
            console.log(m);
          "

      - name: Podpis manifestu
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::Chybí secret UPDATE_SIGNING_KEY — latest.json je bez podpisu, appky ho nepřijmou, dokud se nepodepíše."
            exit 0
          fi
          node -e "
            const fs = require('fs'), crypto = require('crypto');
            const sig = crypto.sign(null, fs.readFileSync('latest.json'), crypto.createPrivateKey(process.env.UPDATE_SIGNING_KEY));
            fs.writeFileSync('latest.json.sig', sig.toString('base64'));
          "

      # Vynucená aktualizace (build.json → mandatory): minimální verze = tahle.
      # Starší appky se po načtení policy.json zablokují a samy se aktualizují.
      # Zapisuje se až s latest.json, tedy po nahrání releasu — zablokovaná
      # appka si tak má vždycky odkud novou verzi stáhnout.
      - name: Politika (vynucená aktualizace)
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          MANDATORY=$(node -p "require('./input/build.json').mandatory === true")
          if [ "$MANDATORY" != "true" ]; then echo "Aktualizace není vynucená."; exit 0; fi
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::Vynucená aktualizace potřebuje secret UPDATE_SIGNING_KEY"; exit 1
          fi
          node -e "
            const fs = require('fs'), crypto = require('crypto');
            const p = { minVersion: process.env.VERSION, disabled: false, message: '', issuedAt: Date.now() };
            const body = JSON.stringify(p, null, 2) + '\n';
            fs.writeFileSync('policy.json', body);
            const sig = crypto.sign(null, Buffer.from(body), crypto.createPrivateKey(process.env.UPDATE_SIGNING_KEY));
            fs.writeFileSync('policy.json.sig', sig.toString('base64'));
            console.log(p);
          "

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s dist/notes.txt ] || echo "Nová verze Asistenta produkce." > dist/notes.txt
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --latest \
            --title "Asistent produkce $VERSION" --notes-file dist/notes.txt \
            dist/AsistentProdukce-arm64.dmg dist/AsistentProdukce-x64.dmg \
            dist/AsistentProdukce-arm64.zip dist/AsistentProdukce-x64.zip

      - name: latest.json do main, úklid build-input
        run: |
          git config --global user.name "asistent-produkce-release"
          git config --global user.email "actions@users.noreply.github.com"
          git fetch origin main
          git worktree add -B main /tmp/rel-main origin/main
          cp latest.json /tmp/rel-main/
          if [ -f latest.json.sig ]; then cp latest.json.sig /tmp/rel-main/
          else rm -f /tmp/rel-main/latest.json.sig; fi  # starý podpis k novému manifestu nepatří
          if [ -f policy.json ]; then cp policy.json policy.json.sig /tmp/rel-main/; fi
          cd /tmp/rel-main
          git add -A latest.json
          git add -A latest.json.sig 2>/dev/null || true
          git add -A policy.json policy.json.sig 2>/dev/null || true
          git commit -m "Vydání $VERSION" || echo "beze změny"
          git push origin main
          cd "$GITHUB_WORKSPACE"
          git push origin --delete build-input
